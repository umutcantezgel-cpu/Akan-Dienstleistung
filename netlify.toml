# ═══════════════════════════════════════════════════════════
# AKAN Dienstleistung — Netlify Configuration
# Next.js App with @netlify/plugin-nextjs
# ═══════════════════════════════════════════════════════════

[build]
  command = "npm run build"
  publish = ".next"

# Netlify Next.js Runtime automatically detects Next.js
# and handles SSR, ISR, API routes, and image optimization.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security Headers (mirrors next.config.ts headers)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Immutable cache for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect www to non-www
[[redirects]]
  from = "https://www.akan-dienstleistung.de/*"
  to = "https://akan-dienstleistung.de/:splat"
  status = 301
  force = true
